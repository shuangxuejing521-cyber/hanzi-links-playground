<section class="dict-section" id="swjz" data-section="说文解字"><header class="dict-section__header"><h2 class="dict-section__title"> ↳ 飯 说文解字 </h2></header><div class="dict-section__body"><div class="dict-ancient"><p class="dict-ancient__ref" style="color: var(--c-accent);"> （说文解字未收录「饭」字头，请参考「<a href="/hans/%E9%A3%AF" style="color: inherit; text-decoration: underline;">飯</a>」字：） </p></div><div class="dict-ancient"><h3 class="dict-sub-title" style="display:block;width:max-content">说文解字·【卷五】·【食部】</h3><img src="https://img.zdic.net/swxz/98EF.svg" alt="飯" style="width:100px; float:left; margin:0 16px 8px 0;" onerror="this.style.display='none';"><p>食也。从食反聲。符萬切</p><div style="clear: both;"></div></div><div class="dict-ancient"><h3 class="dict-sub-title" style="display:block;width:max-content">说文解字注·飯</h3><p><img onerror="this.style.display='none';" style="width:100px;max-width:100px;height:auto;float:left;margin:0 16px 8px 0;" width="100" src="https://img.zdic.net/xz/swdz/98EF_7659.svg" /><span class="swbf">(飯)</span><span class="ywyy">食也。</span><span class="swdz">自饎篆巳上皆自物言之，自䉵篆巳下皆自人言之。然則云食也者，謂食之也，此飯之本義也。引伸之所食爲飯。今人於本義讀上聲，於引伸之義讀去聲，古無是分別也。禮記音義云：依字書食旁作卞，扶万反，謂所食也。食旁作反，符晚反，謂食之也。二字不同。今則混之，故隨俗而音此字。陸語殊誤。古衹有飯字，後乃分別作<span style="display:inline-block;position:relative;width:18px;height:21.6px;vertical-align:middle;"><img src="https://img.zdic.net/song/cn/296B3.svg" width="18" height="21.6" loading="lazy" style="position:absolute;left:0;top:0;border:0;"><span style="position:absolute;left:0;top:0;overflow:hidden;color:transparent;pointer-events:none;">𩚳</span></span>，俗又作飰，此正如汳水俗作汴也。唐以前書多作<span style="display:inline-block;position:relative;width:18px;height:21.6px;vertical-align:middle;"><img src="https://img.zdic.net/song/cn/296B3.svg" width="18" height="21.6" loading="lazy" style="position:absolute;left:0;top:0;border:0;"><span style="position:absolute;left:0;top:0;overflow:hidden;color:transparent;pointer-events:none;">𩚳</span></span>字，後來多譌爲餠字。</span><span class="ywyy">从<span style="display:inline-block;position:relative;width:18px;height:21.6px;vertical-align:middle;"><img src="https://img.zdic.net/song/cn/2028A.svg" width="18" height="21.6" loading="lazy" style="position:absolute;left:0;top:0;border:0;"><span style="position:absolute;left:0;top:0;overflow:hidden;color:transparent;pointer-events:none;">𠊊</span></span>反聲。</span><span class="swdz">符萬切。十四部。按大徐不達許意，故切符萬，而不云扶晚也。</span></p><div style="clear: both;"></div></div><div class="dict-section__footer"><a href="#" class="feedback-link copyright" data-section-auto="1">反馈</a></div></div></section>
