<section class="dict-section" id="swjz" data-section="说文解字"><header class="dict-section__header"><h2 class="dict-section__title"><span class="dict-section__char">早</span> 说文解字 </h2></header><div class="dict-section__body"><div class="dict-ancient"><h3 class="dict-sub-title" style="display:block;width:max-content">说文解字·【卷七】·【日部】</h3><img src="https://img.zdic.net/swxz/65E9.svg" alt="早" style="width:100px; float:left; margin:0 16px 8px 0;" onerror="this.style.display='none';"><p>晨也。从日在甲上。子浩切</p><div style="clear: both;"></div></div><div class="dict-ancient"><h3 class="dict-sub-title" style="display:block;width:max-content">说文解字注</h3><p><img onerror="this.style.display='none';" style="width:100px;max-width:100px;height:auto;float:left;margin:0 16px 8px 0;" width="100" src="https://img.zdic.net/xz/swdz/65E9_2523.svg" /><span class="swbf">(早)</span><span class="ywyy">䢅也。</span><span class="swdz">䢅者，早昧爽也。二字互訓，引伸爲凡爭先之偁。周禮大司徒早物，叚早爲草。</span><span class="ywyy">从日在甲上。</span><span class="swdz">甲象人頭，在其上則早之意也。易曰：先甲三日。子浩切。古音在三部。</span></p><div style="clear: both;"></div></div><div class="dict-section__footer"><a href="#" class="feedback-link copyright" data-section-auto="1">反馈</a></div></div></section>
